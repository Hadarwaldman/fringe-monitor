<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fringe Monitor — My Fringe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
  </head>
  <body data-nav="my" data-page="my">
    <div id="site-nav"></div>
    <div class="page">
      <header class="page-head">
        <h1>My Fringe</h1>
        <p class="lede">
          Your schedule, bookings and wishlist in one place. Sync from your
          PlanMyFringe account, or import a CSV/PDF export.
        </p>
        <div class="meta" id="meta">Loading latest scan…</div>
      </header>

      <div class="action-row">
        <button type="button" id="sync-planner-btn" class="sync-btn">⟳ Sync calendar</button>
        <label class="file-label btn-like">
          <input type="file" id="csv-input" accept=".csv,.pdf,text/csv,application/pdf" />
          Import CSV/PDF
        </label>
        <button type="button" id="add-booking-btn" class="btn-secondary">Add booking</button>
        <label class="past-toggle">
          <input type="checkbox" id="show-past-toggle" />
          Show past
        </label>
      </div>
      <div id="sync-status" class="status" role="status"></div>
      <div id="csv-status" class="status" role="status"></div>

      <div class="chip-row" role="group" aria-label="Filter itinerary" id="itin-filters">
        <button type="button" class="chip" data-itin-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-itin-filter="booked" aria-pressed="false">Booked</button>
        <button type="button" class="chip" data-itin-filter="risk" aria-pressed="false">At risk</button>
        <button type="button" class="chip" data-itin-filter="wishlist" aria-pressed="false">Wishlist</button>
      </div>

      <div id="itin-summary" class="status"></div>
      <div id="itinerary"></div>

      <section id="wishlist-extra" hidden>
        <div class="day-group">
          <h3>Wishlist — not scheduled</h3>
        </div>
        <div id="wishlist-cards"></div>
      </section>
    </div>
    <script src="./net.js"></script>
    <script src="./ui.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
